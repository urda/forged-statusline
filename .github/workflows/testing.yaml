name: Testing forged-statusline


on:
  workflow_call:


permissions:
  contents: read


jobs:
  run:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: macOS (Latest)
            os: macos-latest
            tz: UTC
          - name: macOS (Latest, jq 1.6)
            os: macos-latest
            jq: "1.6"
            tz: UTC
          - name: Ubuntu (Latest)
            os: ubuntu-latest
            tz: UTC
          - name: Ubuntu (Latest, jq 1.6, DST zone)
            os: ubuntu-latest
            jq: "1.6"
            tz: America/Los_Angeles
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    # Runners sit in UTC, where jq 1.6's DST shift in fromdateiso8601 is invisible.
    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: 🐚 Pin system bash 3.2 (macOS only)
        if: runner.os == 'macOS'
        run: echo "/bin" >> "${GITHUB_PATH}"

      - name: 🐚 Pin minimum jq
        if: matrix.jq
        env:
          JQ_VERSION: ${{ matrix.jq }}
        run: |
          # Third-party release binary: verify before executing.
          case "${RUNNER_OS}" in
            macOS) asset="jq-osx-amd64"
                   sha256="5c0a0a3ea600f302ee458b30317425dd9632d1ad8882259fcaf4e9b868b2b1ef" ;;
            *)     asset="jq-linux64"
                   sha256="af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44" ;;
          esac
          mkdir -p "${RUNNER_TEMP}/minimum-jq"
          curl -fsSL -o "${RUNNER_TEMP}/minimum-jq/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/${asset}"
          echo "${sha256}  ${RUNNER_TEMP}/minimum-jq/jq" | shasum -a 256 -c -
          chmod 755 "${RUNNER_TEMP}/minimum-jq/jq"
          echo "${RUNNER_TEMP}/minimum-jq" >> "${GITHUB_PATH}"

      - name: 🔎 Record toolchain
        run: |
          bash --version | head -1
          jq --version

      - name: 🔻 Assert minimum Bash (macOS only)
        if: runner.os == 'macOS'
        run: |
          version="$(bash --version | head -1)"
          case "${version}" in
            *"version 3.2."*) ;;
            *) echo "expected the system Bash 3.2, got: ${version}" >&2; exit 1 ;;
          esac

      - name: 🔻 Assert minimum jq
        if: matrix.jq
        env:
          JQ_VERSION: ${{ matrix.jq }}
        run: |
          version="$(jq --version)"
          if [[ "${version}" != "jq-${JQ_VERSION}" ]]; then
            echo "expected jq-${JQ_VERSION}, got: ${version}" >&2
            exit 1
          fi

      - name: 🔢 Version check
        run: make version-check

      - name: 🧪 Test renderer
        run: make test-statusline

      - name: 📦 Test installer
        run: make test-install

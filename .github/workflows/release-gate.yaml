name: Release Gate


# Runs only on a PR into release, and attaches its result to the master head
# SHA. The release branch ruleset requires this check, so a direct
# `git push origin master:release` succeeds only for a SHA that passed the
# gate through an open release PR.
#
# The checks live in scripts/release-gate.sh so they lint with the rest of the
# repo's shell and run by hand before the push.
on:
  pull_request:
    branches:
      - release


permissions:
  contents: read


jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the gate asks whether the version tag is an ancestor
          # of this branch, which a shallow clone cannot answer.
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: 🚦 Release gate
        run: make release-gate

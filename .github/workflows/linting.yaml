name: Linting forged-statusline


on:
  workflow_call:


permissions:
  contents: read


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: 🧹 Lint
        run: make lint
